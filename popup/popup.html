<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Booster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header with title and status -->
    <header class="header">
      <h1 class="title">Review Booster</h1>
      <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Memeriksa…</span>
      </div>
    </header>

    <!-- IP address display -->
    <section class="ip-section">
      <div class="ip-label">IP Publik Anda</div>
      <div class="ip-value" id="ipAddress">—</div>
    </section>

    <!-- Safety instruction message -->
    <section class="instruction" id="instruction">
      <div class="instruction-icon" id="instructionIcon">⏳</div>
      <p class="instruction-text" id="instructionText">Memeriksa keamanan koneksi…</p>
    </section>

    <!-- Generate button -->
    <div class="actions">
      <button id="generateBtn" class="btn btn-primary" disabled>
        Generate
      </button>
    </div>

    <!-- Footer message area -->
    <footer class="footer">
      <span id="message"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
